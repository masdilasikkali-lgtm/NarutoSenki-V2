name: Build Naruto Senki APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Pembersih Otomatis Ruang Disk & Sisa Cache
        run: |
          echo "=== Membersihkan ruang disk & file sementara ==="
          rm -rf /home/runner/work/_temp/*
          mkdir -p /home/runner/work/_temp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android NDK r21e & Build Tools (Java 17 Bawaan)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;29.0.3" "platforms;android-29"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Java JDK 8 (Untuk Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Fix Header Path fmt & Build APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          # 1. Cari lokasi folder induk dari fmt/core.h di dalam repo
          FMT_CORE=$(find "$GITHUB_WORKSPACE" -path "*/fmt/core.h" | head -n 1)
          if [ -n "$FMT_CORE" ]; then
            FMT_INC=$(dirname $(dirname "$FMT_CORE"))
            echo "Ditemukan folder include fmt di: $FMT_INC"
          else
            echo "PERINGATAN: fmt/core.h tidak ditemukan, mengunduh dari GitHub..."
            git clone --depth 1 --branch 9.1.0 https://github.com "$GITHUB_WORKSPACE/external/fmt"
            FMT_INC="$GITHUB_WORKSPACE/external/fmt/include"
          fi

          # 2. Suntikkan path fmt ke semua Android.mk (mendukung := maupun +=) & environment compiler
          find "$GITHUB_WORKSPACE" -name "Android.mk" -exec sed -i -E "s|(LOCAL_C_INCLUDES[[:space:]]*[:+]?=)|\1 $FMT_INC |g" {} +
          export CPATH="$FMT_INC:$CPATH"
          export CPLUS_INCLUDE_PATH="$FMT_INC:$CPLUS_INCLUDE_PATH"

          # 3. Konfigurasi SDK & NDK di local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

          # 4. Build Release APK (tanpa spam titik-titik unduhan Gradle)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace

          # 5. Membuat keystore sementara & menandatangani APK
          keytool -genkey -v -keystore release.keystore -alias naruto -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=NarutoSenki, OU=Dev, O=Game, L=ID, ST=ID, C=ID"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/29.0.3"
          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_UNSIGNED" ]; then
            echo "ERROR: File APK unsigned tidak ditemukan setelah build!"
            exit 1
          fi

          $BUILD_TOOLS/zipalign -v -p 4 "$APK_UNSIGNED" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NarutoSenki-V2-Release.apk aligned.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Naruto Senki V2 Build #${{ github.run_number }}
          files: projects/NarutoSenki/proj.android-studio/NarutoSenki-V2-Release.apk

      - name: Pembersih Otomatis Setelah Build
        if: always()
        run: |
          rm -rf /home/runner/work/_temp/* || true
          rm -rf projects/NarutoSenki/proj.android-studio/app/build || true
